name: ci

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      upstream_ref:
        description: "Optional upstream ref to test. Defaults to main."
        required: false
        type: string

concurrency:
  group: ${{ github.workflow }}::${{ github.ref }}
  cancel-in-progress: true

jobs:
  cargo-deny:
    name: cargo-deny
    uses: ./.github/workflows/cargo-deny.yml
    with:
      upstream_ref: ${{ inputs.upstream_ref || 'main' }}
    secrets: inherit

  codespell:
    name: Codespell
    uses: ./.github/workflows/codespell.yml
    secrets: inherit

  repo-checks:
    name: repo-checks
    uses: ./.github/workflows/repo-checks.yml
    with:
      upstream_ref: ${{ inputs.upstream_ref || 'main' }}
    secrets: inherit

  rust-ci:
    name: rust-ci
    uses: ./.github/workflows/rust-ci.yml
    with:
      upstream_ref: ${{ inputs.upstream_ref || 'main' }}
    secrets: inherit

  sdk:
    name: sdk
    uses: ./.github/workflows/sdk.yml
    with:
      upstream_ref: ${{ inputs.upstream_ref || 'main' }}
    secrets: inherit

  required:
    name: CI required
    if: ${{ always() }}
    needs:
      - cargo-deny
      - codespell
      - repo-checks
      - rust-ci
      - sdk
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Require successful dependencies
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: python3 .github/scripts/check_ci_results.py
